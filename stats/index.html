<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статистика</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/stats/stats.css">
</head>
<body>

  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1 class="login-title">Панель статистики</h1>
      <p class="login-subtitle">Приглашение http://193.233.91.241</p>
      <form id="login-form">
        <label for="stats-code">Код доступа</label>
        <input type="password" id="stats-code" placeholder="••••••••" required autocomplete="off">
        <button type="submit" class="btn btn-primary">Войти</button>
      </form>
      <p id="login-error" class="error-msg" hidden></p>
    </div>
  </div>

  <div id="stats-app" class="stats-app" style="display:none">
    <header class="stats-header">
      <div class="stats-header__inner">
        <div>
          <h1>Статистика</h1>
          <p class="stats-header__sub" id="fetched-at"></p>
        </div>
        <div class="stats-header__actions">
          <button type="button" id="refresh-btn" class="btn btn-outline">Обновить</button>
          <button type="button" id="logout-btn" class="btn btn-outline">Выйти</button>
        </div>
      </div>
    </header>

    <main class="stats-main" id="stats-content">
      <p class="loading-msg">Загрузка…</p>
    </main>
  </div>

  <script src="/stats/stats.js"></script>
</body>
</html>
